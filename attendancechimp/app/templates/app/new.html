<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="bio">
        <h1>Sign-Up</h1>
        <form action="/app/createUser" method="POST">
            {% csrf_token %}

            <p><label>Username: <input type="text" name="user_name"></label></p>

            <p><label>Email: <input type="email" name="email"></label></p>

            <p><label>Password: <input type="password" name="password"></label></p>

            <p><label><input type="radio" name="is_student" value="1"> Student</label></p>

            <p><label><input type="radio" name="is_student" value="0"> Instructor</label></p>

            <button type="submit">Sign Up</button>
        </form>

    </div>
</body>
</html>
